# Deploy the podcast download site (podcast-site/) to GitHub Pages.
#
# Runs on every push to main (including pushes from the bot VM's daily.sh and
# from daily-catchup.yml) and can also be dispatched manually.
#
# `node scripts/podcast/site.mjs` is idempotent and rebuilds podcast-site/
# from scratch by scanning podcast/episodes/**/episode.json, so no build
# artifacts ever need to be committed from a client. On a brand-new repo (or a
# repo without episodes) it still produces valid, empty output.
#
# One-time setup: Repo Settings -> Pages -> Source: "GitHub Actions". Without
# this the deploy-pages step fails with guidance to enable it.
#
# Base URL comes from scripts/podcast/config.json (config.site.baseUrl =
# https://ryosaku610.github.io/researchphantom-daily, the live Pages URL).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site from all episodes
        run: node scripts/podcast/site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: podcast-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
