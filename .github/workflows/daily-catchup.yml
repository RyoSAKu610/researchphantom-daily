# Scheduled audit (read-only): verify that recent podcast dates are complete
# (every configured language present, status ok, audio file on disk, duration
# inside config.duration bounds) and exit non-zero when something is missing.
#
# This used to synthesize missing episodes with edge-tts on GitHub-hosted
# runners; edge-tts is banned from the pipeline now (audio must come from the
# self-hosted engines on the bot VM), and the engines do not exist on GitHub
# runners anyway. So the scheduled slot is a watchdog: a red X here means the
# bot VM failed to produce complete audio — repair tts-hub / VoiceStudio there
# and re-run scripts/podcast/bot/daily.sh.
#
# 06:30 JST is the regular slot (the bot's daily.sh normally finishes before
# this); the 06:37 run is a retry margin for a delayed bot (it only reads the
# repository, it never writes).
name: daily-catchup

on:
  schedule:
    - cron: "30 21 * * *"   # 06:30 JST
    - cron: "37 21 * * *"   # 06:37 JST (retry margin)
  workflow_dispatch:

permissions:
  contents: read            # audit only: no push, no pages artifact

concurrency:
  group: daily-catchup
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit recent episodes (report only, no TTS)
        run: node scripts/podcast/audit.mjs
